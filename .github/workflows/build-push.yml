name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      openclaw_version:
        description: 'OpenClaw version to build (e.g. latest, 4.0.2)'
        required: false
        default: 'latest'
      openclaw_source:
        description: 'OpenClaw source (zh or official)'
        required: false
        default: 'zh'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: qingchencloud/openclaw

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - target: full
            dockerfile: full/Dockerfile
            tag_suffix: ""
          - target: gateway
            dockerfile: gateway/Dockerfile
            tag_suffix: "-gateway"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version and tags
        id: meta
        run: |
          VERSION="${{ github.event.inputs.openclaw_version || 'latest' }}"
          SOURCE="${{ github.event.inputs.openclaw_source || 'zh' }}"

          # 如果是 tag 触发，从 tag 名提取版本
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          SUFFIX="${{ matrix.tag_suffix }}"
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest${SUFFIX}"

          if [ "$VERSION" != "latest" ]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}${SUFFIX}"
          fi

          # 原版标签
          if [ "$SOURCE" = "official" ]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:official${SUFFIX}"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "source=${SOURCE}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            OPENCLAW_VERSION=${{ steps.meta.outputs.version }}
            OPENCLAW_SOURCE=${{ steps.meta.outputs.source }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-description:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update GHCR description
        run: |
          echo "✅ Images built and pushed successfully"
          echo "📦 ghcr.io/${{ env.IMAGE_NAME }}:latest"
          echo "📦 ghcr.io/${{ env.IMAGE_NAME }}:gateway"
